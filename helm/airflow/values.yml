executor: KubernetesExecutor

airflowVersion: "3.0.2"

images:
  airflow:
    repository: hisham21113/hr-platform
    tag: "6fe7f98cab456fdcb66f72ba11bf73ff063a1194"

config:
  kubernetes_executor:
    delete_worker_pods_on_failure: 'False'

webserver:
  replicas: 1

scheduler:
  replicas: 1

triggerer:
  replicas: 0

workers:
  replicas: 0
  kubernetes:
    extraEnvFrom: |
      - secretRef:
          name: airflow-env

postgresql:
  enabled: true

redis:
  enabled: false

createUserJob:
  useHelmHooks: false

migrateDatabaseJob:
  useHelmHooks: false

serviceAccount:
  create: true

logs:
  persistence:
    enabled: false

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/hishamkamel21/Hr-Platform.git
    branch: main
    rev: HEAD
    depth: 1
    subPath: "dags"
    period: 30s

env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "False"
  - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
    value: "False"
  - name: TZ
    value: "Africa/Cairo"

extraEnvFrom: |
  - secretRef:
      name: airflow-env
